<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e6">
    <meta name="description" content="Conoce el centro de San Miguel Tecomatlán, Oaxaca.">
    <title>Centro de San Miguel Tecomatlán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; --paper: #f4f0e6; --ink: #1c2925; --muted: #66716a; --green-dark: #244437; --clay: #ba5237; --line: #d7d3c8; --serif: "DM Serif Display", Georgia, serif; --sans: "Manrope", "Trebuchet MS", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
        .header { display: flex; min-height: 72px; align-items: center; justify-content: space-between; gap: 20px; padding: 12px clamp(20px, 6vw, 88px); border-bottom: 1px solid var(--line); }
        .brand { color: var(--green-dark); font-size: 11px; font-weight: 800; text-decoration: none; }
        nav { display: flex; flex-wrap: wrap; gap: 22px; }
        nav a { color: #48554e; font-size: 11px; font-weight: 800; text-decoration: none; }
        nav a:hover { color: var(--clay); }
        main { max-width: 1120px; margin: auto; padding: clamp(52px, 8vw, 100px) clamp(22px, 9vw, 136px); }
        .eyebrow { margin: 0 0 12px; color: var(--clay); font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        h1 { margin: 0 0 28px; font: 400 clamp(42px, 7vw, 78px)/1.04 var(--serif); }
        section { padding: 30px 0 42px; scroll-margin-top: 24px; }
        h3 { margin: 0 0 18px; color: var(--green-dark); font: 400 clamp(30px, 4vw, 42px)/1.1 var(--serif); }
        .photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .map-photo { grid-column: 1 / -1; }
        figure { margin: 0; background: #e9e4d8; }
        img { display: block; width: 100%; max-height: 680px; aspect-ratio: 4 / 3; object-fit: cover; }
        .map-photo img { aspect-ratio: auto; object-fit: contain; object-position: center; }
        figcaption { padding: 12px 15px; color: var(--muted); font-size: 11px; font-weight: 700; }
        .footer { padding: 22px clamp(20px, 6vw, 88px); background: var(--ink); color: #d9ded4; font-size: 10px; }
        .footer a { color: #f1c45a; }
        @media (max-width: 650px) { .header { align-items: flex-start; flex-direction: column; } nav { gap: 16px; } .photo-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <a class="brand" href="Index.html">SAN MIGUEL TECOMATLÁN</a>
        <nav aria-label="Secciones del centro">
            <a href="#parque">Parque</a>
            <a href="#municipio">Municipio</a>
            <a href="#primaria">Primaria</a>
        </nav>
    </header>
    <main>
        <p class="eyebrow">Oaxaca · México</p>
        <h1>Centro</h1>
        <figure><img src="imagen/kiosko.jpeg" alt="Kiosco en el centro de San Miguel Tecomatlán" loading="lazy"><figcaption>Kiosco</figcaption></figure>
        <section id="parque" aria-labelledby="parque-title">
            <h3 id="parque-title">Parque</h3>
            <div class="photo-grid">
                <figure><img src="imagen/parque.jpeg" alt="Parque de San Miguel Tecomatlán" loading="lazy"><figcaption>Parque</figcaption></figure>
                <figure><img src="imagen/fuente.jpeg" alt="Fuente del parque de San Miguel Tecomatlán" loading="lazy"><figcaption>Fuente</figcaption></figure>
            </div>
        </section>
        <section id="municipio" aria-labelledby="municipio-title">
            <h3 id="municipio-title">Municipio</h3>
            <div class="photo-grid">
                <figure><img src="imagen/municipio.jpeg" alt="Edificio municipal de San Miguel Tecomatlán" loading="lazy"><figcaption>Municipio</figcaption></figure>
                <figure class="map-photo"><img src="imagen/mapa-limpio.jpeg" alt="Pintura del mapa de San Miguel Tecomatlán" loading="lazy"><figcaption>Mapa</figcaption></figure>
            </div>
        </section>
        <section id="primaria" aria-labelledby="primaria-title">
            <h3 id="primaria-title">Primaria</h3>
            <div class="photo-grid">
                <figure><img src="imagen/mural.jpeg" alt="Mural de la escuela primaria de San Miguel Tecomatlán" loading="lazy"><figcaption>Primaria</figcaption></figure>
            </div>
        </section>
    </main>
    <footer class="footer"><a href="Index.html">Volver a San Miguel Tecomatlán</a></footer>
</body>
</html>
