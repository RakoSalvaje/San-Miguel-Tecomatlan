<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e6">
    <meta name="description" content="Zonas de cultivo y Abinos en el llano de San Miguel Tecomatlán.">
    <title>Llano de San Miguel Tecomatlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: light; --paper: #f4f0e6; --ink: #1c2925; --muted: #66716a; --green: #355d4c; --green-dark: #244437; --clay: #ba5237; --line: #d7d3c8; --serif: "DM Serif Display", Georgia, serif; --sans: "Manrope", "Trebuchet MS", sans-serif; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 90px; }
        body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
        a { color: inherit; }
        .header { position: sticky; z-index: 2; top: 0; display: flex; min-height: 72px; align-items: center; justify-content: space-between; gap: 20px; padding: 12px clamp(20px, 6vw, 88px); border-bottom: 1px solid var(--line); background: rgb(244 240 230 / 95%); backdrop-filter: blur(12px); }
        .brand { color: var(--green-dark); font-size: 11px; font-weight: 800; text-decoration: none; }
        nav { display: flex; flex-wrap: wrap; gap: 22px; }
        nav a { color: #48554e; font-size: 11px; font-weight: 800; text-decoration: none; }
        nav a:hover { color: var(--clay); }
        main { max-width: 1440px; margin: auto; }
        .intro { padding: clamp(52px, 8vw, 100px) clamp(22px, 9vw, 136px) 42px; }
        .eyebrow { margin: 0 0 12px; color: var(--clay); font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        h1, h2, h3, p { margin-top: 0; }
        h1 { margin-bottom: 0; font: 400 clamp(42px, 7vw, 78px)/1.04 var(--serif); }
        .section { padding: 38px clamp(22px, 9vw, 136px) 70px; }
        .section + .section { padding-top: 20px; }
        h2 { margin-bottom: 24px; color: var(--green-dark); font: 400 clamp(32px, 4vw, 48px)/1.1 var(--serif); }
        h3 { margin: 0 0 18px; color: var(--clay); font: 400 30px/1.1 var(--serif); }
        .photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        figure { min-width: 0; margin: 0; background: #e9e4d8; }
        figure.wide { grid-column: 1 / -1; }
        figure img { display: block; width: 100%; max-height: 610px; aspect-ratio: 4 / 3; object-fit: cover; }
        figure.wide img { aspect-ratio: 2.15 / 1; }
        figcaption { padding: 12px 15px; color: var(--muted); font-size: 11px; font-weight: 700; }
        .footer { padding: 22px clamp(20px, 6vw, 88px); background: var(--ink); color: #d9ded4; font-size: 10px; }
        .footer a { color: #f1c45a; }
        @media (max-width: 650px) { .header { align-items: flex-start; flex-direction: column; gap: 9px; } nav { gap: 15px; } .photo-grid { grid-template-columns: 1fr; } figure.wide { grid-column: auto; } figure.wide img { aspect-ratio: 4 / 3; } .section { padding-bottom: 50px; } }
        @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
</head>
<body>
    <header class="header">
        <a class="brand" href="Index.html">SAN MIGUEL TECOMATLÁN</a>
        <nav aria-label="Secciones del llano">
            <a href="#zonas-de-cultivo">Zonas de cultivo</a>
            <a href="#abinos">Abinos</a>
        </nav>
    </header>
    <main>
        <div class="intro">
            <p class="eyebrow">Mixteca · Oaxaca</p>
            <h1>Llano de San Miguel Tecomatlan</h1>
        </div>
        <section class="section" id="zonas-de-cultivo" aria-labelledby="cultivo-title">
            <h2 id="cultivo-title">Zonas de cultivo</h2>
            <div class="photo-grid">
                <figure class="wide"><img src="imagen/panoramica llano.jpeg" alt="Vista panorámica del llano y sus zonas de cultivo" loading="lazy"><figcaption>Zonas de cultivo</figcaption></figure>
            </div>
        </section>
        <section class="section" id="abinos" aria-labelledby="abinos-title">
            <h2 id="abinos-title">Abinos</h2>
            <div class="photo-grid">
                <figure><img src="imagen/abinos 1.jpeg" alt="Zona de cultivo de Abinos" loading="lazy"><figcaption>Zona de cultivo (Abinos)</figcaption></figure>
                <figure><img src="imagen/abinos 2.jpeg" alt="Terrenos de cultivo en Abinos" loading="lazy"><figcaption>Abinos</figcaption></figure>
            </div>
        </section>
    </main>
    <footer class="footer"><a href="Index.html">Volver a San Miguel Tecomatlán</a></footer>
</body>
</html>
